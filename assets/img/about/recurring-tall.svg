.b{font-weight:600}
.s{fill:#a3aabb}
.bl{fill:#7b98f6}
.rd{fill:#ff8a94}
.am{fill:#f5b63d}
.gr{fill:#34c77b}
</style>
<defs><marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5 2 10 6 2.5 10" fill="none" stroke="#4672f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ai" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5 2 10 6 2.5 10" fill="none" stroke="#a3aabb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ak" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5 2 10 6 2.5 10" fill="none" stroke="#eef0f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow"><stop offset="0" stop-color="#4672f0" stop-opacity="0.16"/><stop offset="1" stop-color="#4672f0" stop-opacity="0"/></radialGradient><linearGradient id="fa" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="560"><stop offset="0" stop-color="#4672f0" stop-opacity="0.9"/><stop offset="1" stop-color="#4672f0" stop-opacity="0.04"/></linearGradient><linearGradient id="fb" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="0" y2="970"><stop offset="0" stop-color="#4672f0" stop-opacity="0.9"/><stop offset="1" stop-color="#4672f0" stop-opacity="0.04"/></linearGradient><linearGradient id="fl" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="52" y2="0"><stop offset="0" stop-color="#4672f0" stop-opacity="0.9"/><stop offset="1" stop-color="#4672f0" stop-opacity="0.04"/></linearGradient></defs>
<text x="20" y="40" font-size="17" class="b">One-off test</text><text x="20" y="64" font-size="15" class="s">A snapshot</text><text x="20" y="84" font-size="15" class="s">that ages</text><text x="200" y="40" font-size="17" class="b">Recurring</text><text x="200" y="60" font-size="17" class="b">programme</text><text x="200" y="84" font-size="15" class="s">Evidence kept current</text><line x1="40" y1="118" x2="40" y2="760" stroke="#353d58" stroke-width="1.6" stroke-linecap="round"/><rect x="22" y="150" width="9" height="410" rx="3" fill="url(#fa)"/><rect x="22" y="560" width="9" height="200" rx="3" fill="url(#fb)"/><circle cx="40" cy="150" r="10" fill="#0c0f19" stroke="#eef0f6" stroke-width="2.2"/><circle cx="40" cy="150" r="3.4" fill="#eef0f6" stroke="none" stroke-width="0"/><text x="62" y="155" font-size="15" class="s">Test</text><circle cx="40" cy="560" r="10" fill="#0c0f19" stroke="#eef0f6" stroke-width="2.2"/><circle cx="40" cy="560" r="3.4" fill="#eef0f6" stroke="none" stroke-width="0"/><text x="62" y="565" font-size="15" class="s">Test</text><text x="62" y="340" font-size="14" class="s">Evidence ages</text><text x="62" y="360" font-size="14" class="s">until the</text><text x="62" y="380" font-size="14" class="s">next test</text><line x1="220" y1="118" x2="220" y2="768" stroke="#4672f0" stroke-width="2" stroke-linecap="round" marker-end="url(#ab)"/><rect x="202" y="150" width="9" height="100" fill="#4672f0" fill-opacity="0.85"/><rect x="202" y="250" width="9" height="100" fill="#4672f0" fill-opacity="0.32"/><rect x="202" y="350" width="9" height="100" fill="#4672f0" fill-opacity="0.85"/><rect x="202" y="450" width="9" height="100" fill="#4672f0" fill-opacity="0.32"/><rect x="202" y="550" width="9" height="100" fill="#4672f0" fill-opacity="0.85"/><rect x="202" y="650" width="9" height="110" fill="#4672f0" fill-opacity="0.32"/><circle cx="220" cy="150" r="10" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="220" cy="150" r="3.4" fill="#4672f0" stroke="none" stroke-width="0"/><text x="244" y="155" font-size="15" class="b">Baseline</text><path d="M220 242L228 250L220 258L212 250Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="244" y="255" font-size="15" class="s">Release</text><circle cx="220" cy="350" r="10" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="220" cy="350" r="3.4" fill="#4672f0" stroke="none" stroke-width="0"/><text x="244" y="355" font-size="15" class="b">Reassess</text><path d="M220 442L228 450L220 458L212 450Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="244" y="455" font-size="15" class="s">Fix</text><circle cx="220" cy="550" r="10" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="220" cy="550" r="3.4" fill="#4672f0" stroke="none" stroke-width="0"/><text x="244" y="555" font-size="15" class="b">Verify</text><path d="M220 642L228 650L220 658L212 650Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="244" y="655" font-size="15" class="s">Change</text><rect x="20" y="803" width="32" height="10" rx="3" fill="url(#fl)"/><text x="62" y="812" font-size="14" class="s">How current the evidence is</text><circle cx="36" cy="838" r="8" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="36" cy="838" r="2.7" fill="#4672f0" stroke="none" stroke-width="0"/><text x="62" y="843" font-size="14" class="s">Assessment or retest</text><path d="M36 861L43 868L36 875L29 868Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="873" font-size="14" class="s">Release, fix or other change</text>
</svg>
