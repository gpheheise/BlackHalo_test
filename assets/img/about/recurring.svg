<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 392" width="1100" height="392" role="img" aria-labelledby="t d">
<title id="t">Recurring testing keeps evidence current</title>
<desc id="d">Two timelines. A one-off test produces evidence that is current on the day of the test and then steadily ages until the next test. A recurring programme renews the evidence at each assessment or retest; every release, fix or change lowers how current it is until the next check renews it. Illustrative cadence only.</desc>
