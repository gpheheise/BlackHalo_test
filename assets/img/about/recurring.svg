text{font-family:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;fill:#eef0f6}
.mo{font-family:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.08em}
.b{font-weight:600}
.s{fill:#a3aabb}
.bl{fill:#7b98f6}
.rd{fill:#ff8a94}
.am{fill:#f5b63d}
.gr{fill:#34c77b}
</style>
<defs><marker id="ab" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5 2 10 6 2.5 10" fill="none" stroke="#4672f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ai" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5 2 10 6 2.5 10" fill="none" stroke="#a3aabb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="ak" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2.5 2 10 6 2.5 10" fill="none" stroke="#eef0f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow"><stop offset="0" stop-color="#4672f0" stop-opacity="0.16"/><stop offset="1" stop-color="#4672f0" stop-opacity="0"/></radialGradient><linearGradient id="fa" gradientUnits="userSpaceOnUse" x1="320" y1="0" x2="860" y2="0"><stop offset="0" stop-color="#4672f0" stop-opacity="0.9"/><stop offset="1" stop-color="#4672f0" stop-opacity="0.04"/></linearGradient><linearGradient id="fb" gradientUnits="userSpaceOnUse" x1="860" y1="0" x2="1400" y2="0"><stop offset="0" stop-color="#4672f0" stop-opacity="0.9"/><stop offset="1" stop-color="#4672f0" stop-opacity="0.04"/></linearGradient><linearGradient id="fl" gradientUnits="userSpaceOnUse" x1="36" y1="0" x2="96" y2="0"><stop offset="0" stop-color="#4672f0" stop-opacity="0.9"/><stop offset="1" stop-color="#4672f0" stop-opacity="0.04"/></linearGradient></defs>
<text x="36" y="104" font-size="19" class="b">One-off test</text><text x="36" y="130" font-size="15" class="s">A snapshot that ages</text><line x1="280" y1="116" x2="1060" y2="116" stroke="#353d58" stroke-width="1.6" stroke-linecap="round"/><rect x="320" y="88" width="540" height="11" rx="3" fill="url(#fa)"/><rect x="860" y="88" width="200" height="11" rx="3" fill="url(#fb)"/><text x="640" y="76" font-size="14" class="s" text-anchor="middle">Evidence ages until the next test</text><circle cx="320" cy="116" r="10" fill="#0c0f19" stroke="#eef0f6" stroke-width="2.2"/><circle cx="320" cy="116" r="3.4" fill="#eef0f6" stroke="none" stroke-width="0"/><text x="320" y="150" font-size="15" class="s" text-anchor="middle">Test</text><circle cx="860" cy="116" r="10" fill="#0c0f19" stroke="#eef0f6" stroke-width="2.2"/><circle cx="860" cy="116" r="3.4" fill="#eef0f6" stroke="none" stroke-width="0"/><text x="860" y="150" font-size="15" class="s" text-anchor="middle">Test</text><text x="36" y="260" font-size="19" class="b">Recurring programme</text><text x="36" y="286" font-size="15" class="s">Evidence kept current</text><line x1="280" y1="272" x2="1062" y2="272" stroke="#4672f0" stroke-width="2" stroke-linecap="round" marker-end="url(#ab)"/><rect x="320" y="244" width="126" height="11" fill="#4672f0" fill-opacity="0.85" rx="3"/><rect x="446" y="244" width="126" height="11" fill="#4672f0" fill-opacity="0.32"/><rect x="572" y="244" width="126" height="11" fill="#4672f0" fill-opacity="0.85"/><rect x="698" y="244" width="126" height="11" fill="#4672f0" fill-opacity="0.32"/><rect x="824" y="244" width="126" height="11" fill="#4672f0" fill-opacity="0.85"/><rect x="950" y="244" width="110" height="11" fill="#4672f0" fill-opacity="0.32"/><circle cx="320" cy="272" r="10" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="320" cy="272" r="3.4" fill="#4672f0" stroke="none" stroke-width="0"/><text x="320" y="308" font-size="15" class="b" text-anchor="middle">Baseline</text><path d="M446 264L454 272L446 280L438 272Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="446" y="308" font-size="15" class="s" text-anchor="middle">Release</text><circle cx="572" cy="272" r="10" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="572" cy="272" r="3.4" fill="#4672f0" stroke="none" stroke-width="0"/><text x="572" y="308" font-size="15" class="b" text-anchor="middle">Reassess</text><path d="M698 264L706 272L698 280L690 272Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="698" y="308" font-size="15" class="s" text-anchor="middle">Fix</text><circle cx="824" cy="272" r="10" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="824" cy="272" r="3.4" fill="#4672f0" stroke="none" stroke-width="0"/><text x="824" y="308" font-size="15" class="b" text-anchor="middle">Verify</text><path d="M950 264L958 272L950 280L942 272Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="950" y="308" font-size="15" class="s" text-anchor="middle">Change</text><rect x="36" y="353" width="60" height="10" rx="3" fill="url(#fl)"/><text x="108" y="362" font-size="14" class="s">How current the evidence is</text><circle cx="400" cy="358" r="8" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="400" cy="358" r="2.7" fill="#4672f0" stroke="none" stroke-width="0"/><text x="416" y="362" font-size="14" class="s">Assessment or retest</text><path d="M612 351L619 358L612 365L605 358Z" fill="#0c0f19" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="628" y="362" font-size="14" class="s">Release, fix or other change</text>
</svg>
