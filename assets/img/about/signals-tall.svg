<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 916" width="380" height="916" role="img" aria-labelledby="t d">
<title id="t">From tool output to decisions</title>
<desc id="d">On the left, many candidate signals from automated tool output. Some lead into a ring of specialist validation, where each is reproduced, proven and scored. Some cannot be reproduced: their context is kept, the limits are recorded and next steps are decided. Others are shown to be false positives and closed with a reason. On the right, three confirmed findings each end in a decision with an owner: fix now, an interim control, or an accepted risk.</desc>
