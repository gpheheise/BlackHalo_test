<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 952" width="380" height="952" role="img" aria-labelledby="t d">
<title id="t">From tool output to decisions</title>
<desc id="d">On the left, many candidate signals from automated tool output. Only some lead into a ring of specialist validation, where each is reproduced, proven and scored; others are dropped because they could not be reproduced. On the right, three verified findings each end in a decision with an owner: fix now, an interim control, or an accepted risk. A retest confirms each outcome.</desc>
