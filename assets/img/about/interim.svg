<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-labelledby="t d">
<title id="t">Interim controls reduce exposure until the fix is verified</title>
<desc id="d">Exposure over time for one finding. When it is found, the attack path is fully open. An interim control that restricts, disables or isolates reduces the exposure, but residual risk remains on record. Monitoring can run alongside to detect attempts; it does not reduce the exposure. When the vendor fix is applied, the finding still awaits a retest, and only the retest closes it. Illustrative: no durations or risk values are implied.</desc>
