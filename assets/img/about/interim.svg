p="round" stroke-linejoin="round"/><text x="1002" y="232" font-size="16" class="b gr">Closed</text><line x1="80" y1="268" x2="1064" y2="268" stroke="#6c7488" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ai)"/><text x="1064" y="294" font-size="12" class="mo s" text-anchor="end">TIME</text><circle cx="120" cy="268" r="11" fill="#0c0f19" stroke="#ff3b4a" stroke-width="2.2"/><circle cx="120" cy="268" r="3.7" fill="#ff3b4a" stroke="none" stroke-width="0"/><text x="120" y="312" font-size="17" class="b" text-anchor="middle">Found</text><text x="120" y="336" font-size="15" class="s" text-anchor="middle">Validated and reported</text><circle cx="400" cy="268" r="11" fill="#0c0f19" stroke="#f5b63d" stroke-width="2.2"/><circle cx="400" cy="268" r="3.7" fill="#f5b63d" stroke="none" stroke-width="0"/><text x="400" y="312" font-size="17" class="b" text-anchor="middle">Interim control</text><text x="400" y="336" font-size="15" class="s" text-anchor="middle">Restrict · disable · isolate</text><circle cx="700" cy="268" r="11" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="700" cy="268" r="3.7" fill="#4672f0" stroke="none" stroke-width="0"/><text x="700" y="312" font-size="17" class="b" text-anchor="middle">Vendor fix</text><text x="700" y="336" font-size="15" class="s" text-anchor="middle">Permanent remediation</text><circle cx="960" cy="268" r="11" fill="#0c0f19" stroke="#34c77b" stroke-width="2"/><path d="M955.4 268.2l3.3 3.5 6.2-6.8" fill="none" stroke="#34c77b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="960" y="312" font-size="17" class="b" text-anchor="middle">Retest</text><text x="960" y="336" font-size="15" class="s" text-anchor="middle">Confirms the gap is closed</text><line x1="400" y1="380" x2="960" y2="380" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="2 6" stroke-linecap="round"/><line x1="400" y1="373" x2="400" y2="387" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round"/><line x1="960" y1="373" x2="960" y2="387" stroke="#a3aabb" stroke-width="1.6" stroke-linecap="round"/><text x="140" y="385" font-size="15" class="b">Monitoring alongside</text><text x="680" y="370" font-size="15" class="s" text-anchor="middle">Detects attempts; does not reduce the exposure</text>
