x2="396" y2="296" stroke="#4672f0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ab)"/><text x="412" y="268" font-size="15">All Core traffic goes through the Envelope</text><path d="M938 226V364H762" fill="none" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ai)"/><text x="926" y="272" font-size="14" class="s" text-anchor="end">Scope and network policy</text><rect x="36" y="300" width="720" height="128" rx="14" fill="#0d1428" stroke="#4672f0" stroke-width="2"/><text x="60" y="336" font-size="20" class="b">Control Envelope</text><text x="732" y="334" font-size="12" class="mo bl" text-anchor="end">NETWORK BOUNDARY</text><text x="60" y="370" font-size="17">Routing · scope rules · controlled egress</text><text x="60" y="400" font-size="15" class="s">Enforced outside the execution environment</text><line x1="208" y1="428" x2="208" y2="476" stroke="#4672f0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ab)"/><rect x="60" y="480" width="320" height="76" rx="12" fill="#0c0f19" stroke="#353d58" stroke-width="1.2"/><circle cx="92" cy="518" r="10" fill="#0c0f19" stroke="#7b98f6" stroke-width="1.6"/><circle cx="92" cy="518" r="3.4" fill="#7b98f6" stroke="none" stroke-width="0"/><text x="116" y="512" font-size="18" class="b">Approved targets</text><text x="116" y="538" font-size="14" class="s">Only the assets you agreed</text><line x1="572" y1="428" x2="572" y2="458" stroke="#ff3b4a" stroke-width="2.2" stroke-linecap="round"/><path d="M564 437l16 16M580 437l-16 16" fill="none" stroke="#ff3b4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="548" y1="461" x2="596" y2="461" stroke="#ff3b4a" stroke-width="3.2" stroke-linecap="round"/><rect x="412" y="480" width="344" height="76" rx="12" fill="#0c0f19" stroke="#ff3b4a" stroke-width="1.2" stroke-opacity="0.5"/><text x="436" y="512" font-size="18" class="b rd">Out of scope: blocked</text><text x="436" y="538" font-size="14" class="s">The route ends at the Envelope</text><line x1="812" y1="448" x2="848" y2="448" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round"/><text x="862" y="453" font-size="14" class="s">Human control</text><line x1="812" y1="482" x2="846" y2="482" stroke="#4672f0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ab)"/><text x="862" y="487" font-size="14" class="s">Network traffic</text><line x1="812" y1="516" x2="848" y2="516" stroke="#ff3b4a" stroke-width="3.2" stroke-linecap="round"/><text x="862" y="521" font-size="14" class="s">Blocked route</text>
