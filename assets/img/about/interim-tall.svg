<line x1="34" y1="50" x2="34" y2="532" stroke="#6c7488" stroke-width="1.4" stroke-linecap="round"/><path d="M350 50H356V532H350" fill="none" stroke="#6c7488" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="371" y="291" font-size="13" class="mo s" text-anchor="middle" transform="rotate(-90 371 291)">FINDING STAYS OPEN UNTIL RETEST</text><circle cx="34" cy="50" r="11" fill="#0c0f19" stroke="#ff3b4a" stroke-width="2.2"/><circle cx="34" cy="50" r="3.7" fill="#ff3b4a" stroke="none" stroke-width="0"/><text x="62" y="57" font-size="19" class="b">Found</text><text x="62" y="82" font-size="16" class="s">Validated and reported</text><circle cx="34" cy="196" r="11" fill="#0c0f19" stroke="#f5b63d" stroke-width="2.2"/><circle cx="34" cy="196" r="3.7" fill="#f5b63d" stroke="none" stroke-width="0"/><text x="62" y="203" font-size="19" class="b">Interim control</text><text x="62" y="228" font-size="16" class="s">Restrict · disable · isolate</text><circle cx="34" cy="404" r="11" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="34" cy="404" r="3.7" fill="#4672f0" stroke="none" stroke-width="0"/><text x="62" y="411" font-size="19" class="b">Vendor fix</text><text x="62" y="436" font-size="16" class="s">Permanent remediation</text><circle cx="34" cy="532" r="11" fill="#0c0f19" stroke="#34c77b" stroke-width="2"/><path d="M29.4 532.2l3.3 3.5 6.2-6.8" fill="none" stroke="#34c77b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="539" font-size="19" class="b">Retest</text><text x="62" y="564" font-size="16" class="s">Confirms the gap is closed</text><rect x="62" y="98" width="276" height="28" rx="6" fill="#ff3b4a" stroke="#ff3b4a" stroke-width="1.4" fill-opacity="0.26"/><text x="76" y="117" font-size="16" class="b">Full exposure</text><rect x="62" y="244" width="196" height="28" rx="6" fill="#f5b63d" stroke="#f5b63d" stroke-width="1.4" fill-opacity="0.22"/><text x="76" y="263" font-size="16" class="b">Reduced exposure</text><text x="62" y="296" font-size="16" class="s">Residual risk stays on record</text><line x1="62" y1="326" x2="90" y2="326" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"/><text x="100" y="331" font-size="16" class="b">Monitoring alongside</text><text x="100" y="353" font-size="16" class="s">detects, does not reduce</text><rect x="62" y="452" width="44" height="28" rx="6" fill="#f5b63d" stroke="#f5b63d" stroke-width="1.4" fill-opacity="0.07" stroke-dasharray="5 4"/><text x="118" y="471" font-size="16" class="s">Awaiting retest</text><circle cx="76" cy="594" r="10" fill="#0c0f19" stroke="#34c77b" stroke-width="2"/><path d="M71.8 594.2l3 3.2 5.6-6.2" fill="none" stroke="#34c77b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="600" font-size="16" class="b gr">Closed, verified</text>
</svg>
