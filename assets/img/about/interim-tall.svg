<line x1="34" y1="50" x2="34" y2="506" stroke="#6c7488" stroke-width="1.4" stroke-linecap="round"/><path d="M350 50H356V506H350" fill="none" stroke="#6c7488" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><text x="372" y="278" font-size="11" class="mo s" text-anchor="middle" transform="rotate(-90 372 278)">FINDING STAYS OPEN UNTIL RETEST</text><circle cx="34" cy="50" r="11" fill="#0c0f19" stroke="#ff3b4a" stroke-width="2.2"/><circle cx="34" cy="50" r="3.7" fill="#ff3b4a" stroke="none" stroke-width="0"/><text x="62" y="56" font-size="18" class="b">Found</text><text x="62" y="80" font-size="15" class="s">Validated and reported</text><circle cx="34" cy="202" r="11" fill="#0c0f19" stroke="#f5b63d" stroke-width="2.2"/><circle cx="34" cy="202" r="3.7" fill="#f5b63d" stroke="none" stroke-width="0"/><text x="62" y="208" font-size="18" class="b">Interim control</text><text x="62" y="232" font-size="15" class="s">Restrict · disable ·</text><text x="62" y="252" font-size="15" class="s">isolate · detect</text><circle cx="34" cy="370" r="11" fill="#0c0f19" stroke="#4672f0" stroke-width="2.2"/><circle cx="34" cy="370" r="3.7" fill="#4672f0" stroke="none" stroke-width="0"/><text x="62" y="376" font-size="18" class="b">Vendor fix</text><text x="62" y="400" font-size="15" class="s">Permanent remediation</text><circle cx="34" cy="506" r="11" fill="#0c0f19" stroke="#34c77b" stroke-width="2"/><path d="M29.4 506.2l3.3 3.5 6.2-6.8" fill="none" stroke="#34c77b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="512" font-size="18" class="b">Retest</text><text x="62" y="536" font-size="15" class="s">Confirms the gap is closed</text><rect x="62" y="102" width="282" height="26" rx="6" fill="#ff3b4a" stroke="#ff3b4a" stroke-width="1.4" fill-opacity="0.26"/><text x="76" y="120" font-size="14" class="b">Full exposure</text><rect x="62" y="272" width="170" height="26" rx="6" fill="#f5b63d" stroke="#f5b63d" stroke-width="1.4" fill-opacity="0.22"/><text x="76" y="290" font-size="14" class="b">Reduced exposure</text><text x="62" y="322" font-size="14" class="s">Residual risk stays on record</text><rect x="62" y="422" width="44" height="26" rx="6" fill="#f5b63d" stroke="#f5b63d" stroke-width="1.4" fill-opacity="0.07" stroke-dasharray="5 4"/><text x="118" y="440" font-size="14" class="s">Awaiting retest</text><circle cx="76" cy="571" r="10" fill="#0c0f19" stroke="#34c77b" stroke-width="2"/><path d="M71.8 571.2l3 3.2 5.6-6.2" fill="none" stroke="#34c77b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="577" font-size="15" class="b gr">Closed, verified</text>
