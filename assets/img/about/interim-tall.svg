.mo{font-family:"Geist Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.08em}
.b{font-weight:600}
.s{fill:#a3aabb}
.bl{fill:#7b98f6}
.rd{fill:#ff8a94}
.am{fill:#f5b63d}
.gr{fill:#34c77b}
</style>
