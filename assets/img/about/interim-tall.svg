<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 610" width="380" height="610" role="img" aria-labelledby="t d">
<title id="t">Interim controls reduce exposure until the fix is verified</title>
<desc id="d">Exposure over time for one finding. When it is found, the attack path is fully open. An interim control reduces the exposure, but residual risk remains on record. When the vendor fix is applied, the finding still awaits a retest. Only the retest closes it. The finding stays open throughout. Illustrative: no durations or risk values are implied.</desc>
