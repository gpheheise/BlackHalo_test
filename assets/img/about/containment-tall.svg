ap="round" marker-end="url(#ab)"/><text x="126" y="512" font-size="16">All Core traffic goes</text><text x="126" y="532" font-size="16">through the Envelope</text><rect x="16" y="552" width="320" height="124" rx="14" fill="#0d1428" stroke="#4672f0" stroke-width="2"/><text x="36" y="586" font-size="20" class="b">Control Envelope</text><text x="316" y="584" font-size="13" class="mo bl" text-anchor="end">NETWORK</text><text x="36" y="618" font-size="17">Routing · scope rules · egress</text><text x="36" y="648" font-size="16" class="s">Enforced outside the Core</text><path d="M356 154V614H340" fill="none" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ai)"/><text x="371" y="384" font-size="13" class="mo s" text-anchor="middle" transform="rotate(-90 371 384)">SCOPE AND NETWORK POLICY</text><line x1="96" y1="676" x2="96" y2="720" stroke="#4672f0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ab)"/><rect x="16" y="724" width="168" height="80" rx="12" fill="#0c0f19" stroke="#353d58" stroke-width="1.2"/><text x="30" y="758" font-size="16" class="b">Approved targets</text><text x="30" y="784" font-size="16" class="s">Agreed assets only</text><line x1="256" y1="676" x2="256" y2="700" stroke="#ff3b4a" stroke-width="2.2" stroke-linecap="round"/><path d="M250 681l12 12M262 681l-12 12" fill="none" stroke="#ff3b4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="238" y1="704" x2="274" y2="704" stroke="#ff3b4a" stroke-width="3.2" stroke-linecap="round"/><rect x="196" y="724" width="168" height="80" rx="12" fill="#0c0f19" stroke="#ff3b4a" stroke-width="1.2" stroke-opacity="0.5"/><text x="210" y="758" font-size="16" class="b rd">Out of scope</text><text x="210" y="784" font-size="16" class="s">Route blocked</text><line x1="16" y1="836" x2="46" y2="836" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round"/><text x="56" y="841" font-size="16" c