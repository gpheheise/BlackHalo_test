und" marker-end="url(#ab)"/><text x="190" y="522" font-size="14">All Core traffic goes</text><text x="190" y="540" font-size="14">through the Envelope</text><rect x="16" y="560" width="320" height="118" rx="14" fill="#0d1428" stroke="#4672f0" stroke-width="2"/><text x="36" y="594" font-size="19" class="b">Control Envelope</text><text x="316" y="592" font-size="11" class="mo bl" text-anchor="end">NETWORK</text><text x="36" y="624" font-size="16">Routing · scope rules · egress</text><text x="36" y="652" font-size="15" class="s">Enforced outside the Core</text><path d="M352 146V619H340" fill="none" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ai)"/><text x="368" y="380" font-size="11" class="mo s" text-anchor="middle" transform="rotate(-90 368 380)">SCOPE AND NETWORK POLICY</text><line x1="96" y1="678" x2="96" y2="724" stroke="#4672f0" stroke-width="2.2" stroke-linecap="round" marker-end="url(#ab)"/><rect x="16" y="728" width="168" height="78" rx="12" fill="#0c0f19" stroke="#353d58" stroke-width="1.2"/><text x="32" y="760" font-size="16" class="b">Approved targets</text><text x="32" y="784" font-size="14" class="s">Agreed assets only</text><line x1="256" y1="678" x2="256" y2="704" stroke="#ff3b4a" stroke-width="2.2" stroke-linecap="round"/><path d="M250 683l12 12M262 683l-12 12" fill="none" stroke="#ff3b4a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="238" y1="708" x2="274" y2="708" stroke="#ff3b4a" stroke-width="3.2" stroke-linecap="round"/><rect x="196" y="728" width="168" height="78" rx="12" fill="#0c0f19" stroke="#ff3b4a" stroke-width="1.2" stroke-opacity="0.5"/><text x="212" y="760" font-size="16" class="b rd">Out of scope</text><text x="212" y="784" font-size="14" class="s">Route blocked</text><line x1="16" y1="846" x2="48" y2="846" stroke="#a3aabb" stroke-width="1.6" stroke-dasharray="6 5" stroke-linecap="round"/><text x="60" y="851" font-size="14" class="