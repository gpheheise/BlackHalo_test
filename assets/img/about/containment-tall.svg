<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 922" width="380" height="922" role="img" aria-labelledby="t d">
<title id="t">How the BlackHalo boundary is designed</title>
<desc id="d">The BlackHalo Core, with coordination, execution agents and a challenge and review role, sits above a separate Control Envelope. All Core traffic goes through the Envelope, which applies routing, scope rules and controlled egress, enforced outside the execution environment. Human authority sits outside the Core: objectives and approvals go to the Core, scope and network policy go to the Envelope. The Envelope lets traffic reach approved targets and blocks any route out of scope.</desc>
